# .devcontainer/litellm-config.yaml
# Purpose: LiteLLM proxy configuration template for the Docker Compose variant.
#
# This file is mounted read-only into the litellm service at /app/config.yaml.
# It mirrors the config generated by install.sh but is intended for the Compose
# workflow where you edit this file directly rather than rebuilding a container.
#
# To add a provider: uncomment the relevant stanza and set the required
# environment variable in your .env file or in docker-compose.yml.

model_list:
  # Local Ollama model — always present. Change 'qwen2.5-coder:7b' to any
  # model available at http://ollama:11434.
  - model_name: "qwen2.5-coder:7b"
    litellm_params:
      model: "ollama/qwen2.5-coder:7b"
      api_base: "http://ollama:11434"

  # 'default' alias always routes to the local Ollama model.
  - model_name: "default"
    litellm_params:
      model: "ollama/qwen2.5-coder:7b"
      api_base: "http://ollama:11434"

  # --------------------------------------------------------------------------
  # OpenAI — uncomment and set OPENAI_API_KEY in .env
  # --------------------------------------------------------------------------
  # - model_name: "gpt-4o"
  #   litellm_params:
  #     model: "openai/gpt-4o"
  #     api_key: "os.environ/OPENAI_API_KEY"
  #
  # - model_name: "gpt-4o-mini"
  #   litellm_params:
  #     model: "openai/gpt-4o-mini"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # --------------------------------------------------------------------------
  # Anthropic — uncomment and set ANTHROPIC_API_KEY in .env
  # --------------------------------------------------------------------------
  # - model_name: "claude-sonnet"
  #   litellm_params:
  #     model: "anthropic/claude-sonnet-4-6"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  # --------------------------------------------------------------------------
  # AWS Bedrock — uncomment and set AWS_* vars in .env
  # --------------------------------------------------------------------------
  # - model_name: "claude-sonnet"
  #   litellm_params:
  #     model: "bedrock/anthropic.claude-sonnet-4-5"
  #     aws_region_name: "eu-west-2"

litellm_settings:
  drop_params: true
  request_timeout: 120

general_settings:
  # Local dev master key — not a real secret. Override via LITELLM_MASTER_KEY.
  master_key: "sk-devcontainer"
